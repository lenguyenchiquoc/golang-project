syntax = "proto3";

package manga;

option go_package = "managahub/pkg/proto";

message Genre {
    string id   = 1;
    string name = 2;
}

message MangaResponse {
    string id             = 1;
    string title          = 2;
    string author         = 3;
    repeated Genre genres = 4;
    string status         = 5;
    int32  total_chapters = 6;
    string description    = 7;
    string cover_url      = 8;
    float average_rating = 9;
    int32 rating_count   = 10;
}

message GetMangaRequest {
    string id = 1;
}

message SearchRequest {
    string query  = 1;
    repeated string genre  = 2;
    string status = 3;
    int32  page   = 4;
    int32  limit  = 5;
}

message SearchResponse {
    repeated MangaResponse mangas = 1;
    int32                  total  = 2;
}

message ProgressRequest {
    string user_id         = 1;
    string manga_id        = 2;
    int32  current_chapter = 3;
    string status          = 4;
}

message ProgressResponse {
    bool   success = 1;
    string message = 2;
}

service MangaService {
    rpc GetManga(GetMangaRequest)       returns (MangaResponse);
    rpc SearchManga(SearchRequest)      returns (SearchResponse);
    rpc UpdateProgress(ProgressRequest) returns (ProgressResponse);
    rpc RateManga(RatingRequest) returns (RatingResponse);
    rpc Ping(Empty) returns (Empty);
}

message RatingRequest {
    string user_id  = 1;
    string manga_id = 2;
    int32  rating   = 3;
}

message RatingResponse {
    bool   success = 1;
    string message = 2;
    float  average = 3;
    int32  count   = 4;
}

message Empty {}